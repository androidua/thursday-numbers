name: Network diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Runner egress IP
        run: |
          curl -s --max-time 10 https://api.ipify.org || echo "ipify FAILED"
          echo

      - name: Control sites (baseline reachability)
        run: |
          for u in https://github.com https://www.google.com https://www.thelott.com; do
            curl -s -o /dev/null -w "$u -> HTTP %{http_code} connect=%{time_connect}s total=%{time_total}s\n" --max-time 15 "$u" || echo "$u -> FAILED rc=$?"
          done

      - name: Target, verbose curl
        run: |
          curl -v --max-time 30 -A "Mozilla/5.0" -o /dev/null \
            https://australia.national-lottery.com/powerball/results/08-10-2026 2>&1 | head -40 || true

      - name: Target, raw TCP on 443 and 80
        run: |
          timeout 10 bash -c '</dev/tcp/157.173.205.85/443' && echo "443 open" || echo "443 FAILED/timeout"
          timeout 10 bash -c '</dev/tcp/157.173.205.85/80' && echo "80 open" || echo "80 FAILED/timeout"

      - name: Target, network path (TCP traceroute to 443)
        run: |
          sudo apt-get install -y -qq traceroute >/dev/null 2>&1 || true
          sudo traceroute -T -p 443 -w 2 -m 20 157.173.205.85 2>&1 | tail -25 || true
